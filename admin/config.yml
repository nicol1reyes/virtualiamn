- name: blog
  label: Artículos del blog
  label_singular: Artículo
  folder: content/posts
  format: json
  extension: json
  create: true
  i18n: true
  slug: '{{slug}}'
  identifier_field: title
  summary: '{{title}}'
  sortable_fields:
  - date
  - title
  editor:
    preview: false
  fields:
  - label: Título
    name: title
    widget: string
    i18n: true
  - label: Categoría
    name: category
    widget: string
    i18n: true
  - label: Resumen
    name: excerpt
    widget: text
    i18n: true
  - label: Imagen
    name: image
    widget: image
    i18n: duplicate
  - label: Fecha
    name: date
    widget: datetime
    format: YYYY-MM-DD
    date_format: DD/MM/YYYY
    time_format: false
    i18n: duplicate
  - label: Publicado
    name: published
    widget: boolean
    default: false
    i18n: duplicate
    hint: Si está apagado, aparece en el blog como “Próximamente”.
  - label: Contenido
    name: body
    widget: markdown
    i18n: true
    required: false
- name: ajustes
  label: Datos de contacto y redes
  editor:
    preview: false
  files:
  - name: settings
    label: Datos de contacto y redes
    file: content/settings.json
    format: json
    fields:
    - label: Correo
      name: email
      widget: string
    - label: Teléfono
      name: phone
      widget: string
    - label: Ciudad (ES)
      name: city_es
      widget: string
    - label: Ciudad (EN)
      name: city_en
      widget: string
    - label: Instagram (URL completa)
      name: instagram
      widget: string
      required: false
      hint: Déjalo vacío para ocultar el enlace.
    - label: TikTok (URL completa)
      name: tiktok
      widget: string
      required: false
    - label: Facebook (URL completa)
      name: facebook
      widget: string
      required: false
    - label: LinkedIn (URL completa)
      name: linkedin
      widget: string
      required: false
