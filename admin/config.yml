        name: quote
        widget: text
      - label: Nombre
        name: name
        widget: string
      - label: Empresa o servicio
        name: role
        widget: string
    - label: Cierre · etiqueta
      name: ctaEyebrow
      widget: string
      i18n: true
    - label: Cierre · frase grande
