# Panel de edición de Virtualiamn (Decap CMS) — https://decapcms.org/docs/
# Cambia GITHUB_USUARIO por tu usuario de GitHub.
backend:
  name: github
  repo: nicol1reyes/virtualiamn
  branch: main
  commit_messages:
    create: Crear {{collection}} “{{slug}}”
    update: Actualizar {{collection}} “{{slug}}”
    delete: Eliminar {{collection}} “{{slug}}”
    uploadMedia: Subir imagen “{{path}}”
    deleteMedia: Eliminar imagen “{{path}}”
locale: es
site_url: https://virtualiamn.com
display_url: https://virtualiamn.com
logo_url: /assets/uploads/swirl.webp
media_folder: static/assets/uploads
public_folder: /assets/uploads
i18n:
  structure: single_file
  locales:
  - es
  - en
  default_locale: es
collections:
- name: inicio
  label: Inicio
  i18n: true
  editor:
    preview: false
  files:
  - name: home
    label: Página de inicio
    file: content/home.json
    format: json
    i18n: true
    fields:
    - label: Imagen de portada
      name: heroImage
      widget: image
      i18n: duplicate
    - label: Título grande
      name: heroTitle
      widget: string
      i18n: true
      hint: Corto, 2 a 4 palabras.
    - label: Frase de portada
      name: tagline
      widget: text
      i18n: true
      hint: Cada renglón se muestra como una línea del título.
    - label: Tarjetas que rotan en la portada
      name: coll
      widget: list
      i18n: true
      hint: Las imágenes de las listas se toman de la versión en español.
      fields:
      - label: Marca
        name: brand
        widget: string
      - label: Título
        name: title
        widget: string
      - label: Texto del enlace
        name: cta
        widget: string
      - label: Lleva a
        name: link
        widget: select
        options:
        - label: Redes sociales
          value: redes-sociales
        - label: Publicidad pagada
          value: publicidad
        - label: SEO y sitios web
          value: seo-web
        - label: Branding y contenido
          value: branding
      - label: Imagen
        name: image
        widget: image
    - label: Tarjeta de marcas · cifra
      name: memberValue
      widget: string
      i18n: duplicate
    - label: Tarjeta de marcas · texto
      name: memberCap
      widget: string
      i18n: true
    - label: Tarjeta de marcas · imagen
      name: memberImage
      widget: image
      i18n: duplicate
    - label: Círculo · cifra
      name: pctValue
      widget: string
      i18n: duplicate
    - label: Círculo · texto
      name: pctCap
      widget: string
      i18n: true
    - label: 'Recuadro #01 · título'
      name: badgeTitle
      widget: string
      i18n: true
    - label: 'Recuadro #01 · texto'
      name: badgeBody
      widget: text
      i18n: true
    - label: Especialidades (carrusel con palabras grandes)
      name: trust
      widget: list
      i18n: true
      hint: Las imágenes de las listas se toman de la versión en español.
      fields:
      - label: Palabra 1 (arriba izquierda)
        name: word1
        widget: string
      - label: Palabra 2 (arriba derecha)
        name: word2
        widget: string
      - label: Palabra 3 (abajo izquierda, en negro)
        name: word3
        widget: string
      - label: Palabra 4 (abajo derecha)
        name: word4
        widget: string
      - label: Nombre en la tarjeta
        name: name
        widget: string
      - label: Descripción en la tarjeta
        name: role
        widget: string
      - label: Imagen
        name: image
        widget: image
    - label: Servicios · etiqueta
      name: svcEyebrow
      widget: string
      i18n: true
    - label: Servicios · título
      name: svcTitle
      widget: text
      i18n: true
      hint: La lista de servicios sale de la sección Servicios. Cada renglón es una línea del título.
    - label: Estudio · imagen pequeña
      name: facIcon
      widget: image
      i18n: duplicate
    - label: Estudio · título
      name: facTitle
      widget: text
      i18n: true
      hint: Cada renglón se muestra como una línea del título.
    - label: Estudio · texto
      name: facBody
      widget: text
      i18n: true
    - label: Estudio · tarjeta 1
      name: tile1
      widget: object
      i18n: true
      fields:
      - label: Nombre
        name: name
        widget: string
      - label: Descripción
        name: desc
        widget: string
      - label: Imagen
        name: image
        widget: image
    - label: Estudio · tarjeta 2
      name: tile2
      widget: object
      i18n: true
