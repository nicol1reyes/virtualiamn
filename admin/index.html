<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Editor · Virtualiamn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./editor.css">
<script type="importmap">{ "imports": { "marked": "https://cdn.jsdelivr.net/npm/marked@12.0.2/+esm" } }</script>
</head>
<body>

<!-- Login -->
<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="login-brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v3.5M21 12h-3.5"/></svg>Virtualiamn</div>
    <h1>Editor del sitio</h1>
    <p>Inicia sesión con la cuenta de GitHub que tiene acceso al sitio.</p>
    <button id="login-btn" class="btn btn-primary btn-lg" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true" class="gh"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Iniciar sesión con GitHub
    </button>
    <p id="login-msg" class="login-msg" role="alert" hidden></p>
    <a class="login-alt" href="./clasico/">Usar el panel clásico</a>
  </div>
</div>

<!-- Loading -->
<div id="loading" class="loading" hidden><div class="spinner" aria-hidden="true"></div><p>Cargando tu sitio…</p></div>

<!-- Editor -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="tb-left">
      <a class="tb-brand" href="/" target="_blank" rel="noopener" title="Ver sitio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v3.5M21 12h-3.5"/></svg>
        <span>Virtualiamn</span>
      </a>
      <span class="tb-sep" aria-hidden="true"></span>
      <div class="picker">
        <button id="page-btn" class="picker-btn" type="button" aria-haspopup="listbox" aria-expanded="false"><span data-ic="page"></span><span id="page-name">Inicio</span><span data-ic="chevron-down"></span></button>
        <div id="page-menu" class="picker-menu" role="listbox" hidden></div>
      </div>
    </div>
    <div class="tb-center">
      <div class="seg" role="group" aria-label="Idioma que editas">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="seg" role="group" aria-label="Tamaño de vista previa">
        <button type="button" data-device="desktop" aria-pressed="true" title="Escritorio"><span data-ic="desktop"></span><span class="sr-only">Escritorio</span></button>
        <button type="button" data-device="mobile" aria-pressed="false" title="Celular"><span data-ic="mobile"></span><span class="sr-only">Celular</span></button>
      </div>
    </div>
    <div class="tb-right">
      <span id="status" class="status" aria-live="polite"></span>
      <button id="discard-btn" class="btn btn-dark" type="button" hidden>Descartar</button>
      <button id="publish-btn" class="btn btn-primary" type="button" disabled>Publicar</button>
      <div class="picker">
        <button id="user-btn" class="avatar" type="button" aria-haspopup="menu" aria-expanded="false" title="Cuenta"><img id="user-img" alt=""></button>
        <div id="user-menu" class="picker-menu right" role="menu" hidden>
          <div class="menu-head" id="user-name"></div>
          <a class="menu-item" href="/" target="_blank" rel="noopener"><span data-ic="external"></span>Ver sitio publicado</a>
          <a class="menu-item" href="./clasico/"><span data-ic="list"></span>Panel clásico</a>
          <button class="menu-item" id="logout-btn" type="button"><span data-ic="logout"></span>Cerrar sesión</button>
        </div>
      </div>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar" aria-label="Secciones"></aside>
    <main class="canvas" id="canvas">
      <div class="frame-wrap" id="frame-wrap">
        <iframe id="frame-a" class="frame" title="Vista previa"></iframe>
        <iframe id="frame-b" class="frame" title="Vista previa" hidden></iframe>
      </div>
    </main>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="./editor.js"></script>
</body>
</html>
